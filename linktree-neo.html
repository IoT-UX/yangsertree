<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YANGSER — LINKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFDE59;
    --ink: #111111;
    --white: #FFFFFF;
    --pink: #FF3EA5;
    --blue: #3E7CFF;
    --orange: #FF5C00;
    --red: #FF3B30;
    --indigo: #5865F2;
    --green: #00C853;
    --shadow: #111111;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--bg);
    background-image:
      radial-gradient(var(--ink) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    background-position: -10px -10px;
    min-height:100vh;
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 16px 90px;
  }

  .wrap{
    width:100%;
    max-width:440px;
  }

  /* ---- Profile card ---- */
  .card{
    background:var(--white);
    border:4px solid var(--ink);
    box-shadow:8px 8px 0 var(--shadow);
    padding:28px 24px;
    margin-bottom:28px;
    position:relative;
  }

  .tag{
    position:absolute;
    top:-16px;
    left:20px;
    background:var(--green);
    border:3px solid var(--ink);
    padding:4px 12px;
    font-family:'Archivo Black', sans-serif;
    font-size:11px;
    letter-spacing:1px;
    transform:rotate(-3deg);
    box-shadow:3px 3px 0 var(--shadow);
  }

  .avatar{
    width:104px;
    height:104px;
    border:4px solid var(--ink);
    box-shadow:5px 5px 0 var(--shadow);
    margin:6px auto 18px;
    overflow:hidden;
    background:var(--bg);
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  h1{
    font-family:'Archivo Black', sans-serif;
    font-size:30px;
    text-align:center;
    line-height:1.05;
    letter-spacing:-0.5px;
    margin-bottom:8px;
    text-transform:uppercase;
  }

  .bio{
    text-align:center;
    font-size:14px;
    font-weight:500;
    line-height:1.5;
    color:var(--ink);
  }

  .bio .accent{
    background:var(--pink);
    color:var(--white);
    padding:1px 6px;
    border:2px solid var(--ink);
    font-weight:700;
    display:inline-block;
  }

  /* ---- Links ---- */
  .links{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    border:4px solid var(--ink);
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink);
    font-family:'Archivo Black', sans-serif;
    font-size:16px;
    letter-spacing:0.3px;
    text-transform:uppercase;
    box-shadow:6px 6px 0 var(--shadow);
    transition: transform .1s ease, box-shadow .1s ease;
    background:var(--white);
  }
  .link-btn:hover{
    transform: translate(-4px,-4px);
    box-shadow:10px 10px 0 var(--shadow);
  }
  .link-btn:active{
    transform: translate(3px,3px);
    box-shadow:2px 2px 0 var(--shadow);
  }

  .icon-box{
    flex:0 0 auto;
    width:42px;height:42px;
    border:3px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--white);
  }
  .icon-box svg{width:22px;height:22px;fill:var(--ink);}

  .link-text{
    flex:1;
    display:flex;
    flex-direction:column;
    line-height:1.2;
  }
  .link-text small{
    font-family:'Space Grotesk', sans-serif;
    font-size:11px;
    font-weight:500;
    letter-spacing:0.5px;
    text-transform:none;
    opacity:0.85;
    margin-top:3px;
  }

  .arrow{
    flex:0 0 auto;
    font-size:20px;
    font-family:'Archivo Black', sans-serif;
  }

  .tiktok .icon-box{background:var(--ink);}
  .tiktok .icon-box svg{fill:var(--white);}
  .tiktok{background:var(--white);}

  .instagram{background:var(--pink); color:var(--white);}
  .instagram .icon-box{background:var(--ink);}
  .instagram .icon-box svg{fill:var(--white);}

  .blog{background:var(--blue); color:var(--white);}
  .blog .icon-box{background:var(--white);}
  .blog .icon-box svg{fill:var(--ink);}

  .youtube{background:var(--red); color:var(--white);}
  .youtube .icon-box{background:var(--ink);}
  .youtube .icon-box svg{fill:var(--white);}

  .discord{background:var(--indigo); color:var(--white);}
  .discord .icon-box{background:var(--white);}
  .discord .icon-box svg{fill:var(--indigo);}

  .saweria{background:var(--orange); color:var(--white);}
  .saweria .icon-box{background:var(--ink);}
  .saweria .icon-box svg{fill:var(--white);}

  footer{
    margin-top:32px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  footer span{
    background:var(--ink);
    color:var(--bg);
    padding:6px 14px;
    display:inline-block;
    border:3px solid var(--ink);
  }

  @media (max-width:480px){
    h1{font-size:26px;}
    .card{padding:24px 18px;}
  }
</style>
</head>
